<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>유튜버 영어 표현</title>
<meta name="description" content="좋아하는 유튜버가 실제로 쓰는 영어 표현을 배우고 따라 말해 보세요.">
<meta name="theme-color" content="#2f6fec">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="영어 표현">
<style>
:root{
  --bg:#f6f7f9; --card:#fff; --text:#1d2430; --sub:#5d6675; --line:#e3e6eb;
  --accent:#2f6fec; --accent-soft:#e8f0fe; --good:#1f9d55; --good-soft:#e5f6ec;
  --bad:#d64545; --bad-soft:#fdecec; --warn:#b7791f; --warn-soft:#fdf3e1;
}
@media (prefers-color-scheme: dark){
  :root{ --bg:#14171c; --card:#1d2128; --text:#e8ebf0; --sub:#9aa3b2; --line:#2e343d;
    --accent:#6b9cff; --accent-soft:#22304a; --good:#4cc38a; --good-soft:#1c3328;
    --bad:#ff7b7b; --bad-soft:#3a2224; --warn:#e3b04b; --warn-soft:#3a3020; }
}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--text);font:15px/1.6 system-ui,-apple-system,"Malgun Gothic",sans-serif;-webkit-text-size-adjust:100%;-webkit-tap-highlight-color:transparent;padding-bottom:env(safe-area-inset-bottom)}
header{position:sticky;top:0;z-index:5;background:var(--card);border-bottom:1px solid var(--line);padding:calc(10px + env(safe-area-inset-top)) max(16px,env(safe-area-inset-right)) 10px max(16px,env(safe-area-inset-left));display:flex;gap:10px;align-items:center;flex-wrap:wrap}
header h1{font-size:17px;margin:0;margin-right:auto}
select,button{font:inherit}
select{font-size:16px;max-width:100%;padding:6px 10px;border:1px solid var(--line);border-radius:8px;background:var(--card);color:var(--text)}
main{max-width:860px;margin:0 auto;padding:16px}
.tabs{display:flex;gap:6px;margin-bottom:14px;flex-wrap:wrap}
.tab{border:1px solid var(--line);background:var(--card);color:var(--sub);padding:6px 14px;border-radius:999px;cursor:pointer}
.tab.on{background:var(--accent);border-color:var(--accent);color:#fff}
.note{color:var(--sub);font-size:13px;margin:0 0 14px}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:16px;margin-bottom:14px}
.top{display:flex;gap:8px;align-items:baseline;flex-wrap:wrap}
.expr{font-size:21px;font-weight:700}
.badge{font-size:12px;padding:2px 8px;border-radius:999px;background:var(--accent-soft);color:var(--accent)}
.badge.share{background:var(--good-soft);color:var(--good)}
.badge.best{background:var(--warn-soft);color:var(--warn)}
.meaning{font-weight:600;margin:6px 0 2px}
.nuance{color:var(--sub);margin:0 0 10px}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.btn{border:1px solid var(--line);background:var(--card);color:var(--text);border-radius:8px;padding:6px 12px;cursor:pointer;touch-action:manipulation;min-height:40px}
.btn:active{transform:scale(.97)}
.btn:hover{border-color:var(--accent)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:#fff}
.btn.rec{background:var(--bad);border-color:var(--bad);color:#fff}
.btn:disabled{opacity:.5;cursor:default}
.line{border-top:1px dashed var(--line);margin-top:12px;padding-top:12px}
.label{font-size:12px;color:var(--sub);margin-bottom:2px}
.sent{font-size:16px}
.ko{color:var(--sub);font-size:14px}
.practice .label:has(.scene-head){margin-bottom:8px}
.scene-head{display:flex;gap:10px;align-items:center;color:var(--text);font-size:13px}
.scene-thumb{position:relative;flex:0 0 132px;aspect-ratio:16/9;border:none;padding:0;border-radius:10px;overflow:hidden;cursor:pointer;background:#000}
.scene-thumb img{width:100%;height:100%;object-fit:cover;display:block}
.scene-thumb .play{position:absolute;inset:0;margin:auto;width:34px;height:34px;border-radius:50%;background:rgba(0,0,0,.55);color:#fff;
  display:flex;align-items:center;justify-content:center;font-size:14px}
.scene-thumb .ts{position:absolute;right:5px;bottom:5px;background:rgba(0,0,0,.7);color:#fff;font-size:11px;padding:0 5px;border-radius:4px}
.scene-info{display:flex;flex-direction:column;gap:3px;min-width:0}
.scene-title{font-weight:600;line-height:1.35;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.scene-cap{color:var(--sub);font-size:12px}
body.princess .scene-thumb{border-radius:14px;box-shadow:0 3px 12px rgba(226,88,154,.25)}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-bottom:12px}
.stats div{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:10px;text-align:center}
.stats b{display:block;font-size:20px}
.stats span{font-size:12px;color:var(--sub)}
.chips{display:flex;gap:6px;flex-wrap:wrap;align-items:center;margin-bottom:14px}
.chip{border:1px solid var(--line);background:var(--card);color:var(--sub);border-radius:999px;padding:4px 12px;cursor:pointer;font:inherit;font-size:13px}
.chip.on{background:var(--good-soft);border-color:var(--good);color:var(--good)}
.sec{font-size:17px;margin:18px 0 10px}
.btn.wide{width:100%;margin-top:12px;min-height:44px}
.done-msg{margin-top:12px;padding:10px;border-radius:10px;background:var(--good-soft);color:var(--good);text-align:center;font-weight:600}
.review details{margin-top:8px}
.review summary{list-style:none;display:inline-block}
.review summary::-webkit-details-marker{display:none}
.review-btns{margin-top:10px}
.review-btns .btn{flex:1;min-height:44px}
.empty.small{padding:16px 0}
.shadow{display:none;margin-top:10px;padding:10px 12px;border-radius:10px;background:var(--accent-soft)}
.shadow .row{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-top:8px}
.shadow .sh-adj .btn{min-height:34px;padding:4px 10px;font-size:13px}
.sh-msg{font-weight:600}
.sh-msg.rec{color:var(--bad);font-size:17px}
.sh-msg.fail{color:var(--bad)}
.result{margin-top:10px;padding:10px 12px;border-radius:10px;background:var(--bg);display:none}
.result .score{font-size:22px;font-weight:700}
.w{padding:0 2px;border-radius:4px}
.w.ok{color:var(--good)}
.w.miss{color:var(--bad);background:var(--bad-soft);text-decoration:underline wavy}
.heard{color:var(--sub);font-size:13px;margin-top:4px}
.tip{font-size:13px;margin-top:4px}
#player-wrap{position:fixed;right:16px;bottom:16px;width:min(420px,calc(100vw - 32px));background:var(--card);border:1px solid var(--line);border-radius:12px;box-shadow:0 8px 30px rgba(0,0,0,.25);padding:8px;display:none;z-index:10}
#player-wrap .bar{display:flex;justify-content:space-between;align-items:center;font-size:13px;color:var(--sub);margin-bottom:6px;gap:8px}
#player-box{position:relative;width:100%;aspect-ratio:16/9}
#player-box iframe,#player{position:absolute;inset:0;width:100%;height:100%}
.empty{color:var(--sub);text-align:center;padding:40px 0}
a{color:var(--accent)}
.install{display:none;margin:0 0 14px;padding:10px 12px;border-radius:10px;background:var(--accent-soft);color:var(--text);font-size:14px}
.install .row{margin-top:6px}
body.player-open main{padding-bottom:calc(56vw + 80px)}

/* ── 휴대폰 ── */
@media (max-width:600px){
  header h1{font-size:16px}
  header select{flex:1 1 100%}
  main{padding:12px 12px 24px}
  .tabs{flex-wrap:nowrap;overflow-x:auto;scrollbar-width:none;margin:0 -12px 12px;padding:0 12px}
  .tabs::-webkit-scrollbar{display:none}
  .tab{flex:0 0 auto;padding:8px 14px}
  .card{padding:14px;border-radius:12px}
  .expr{font-size:20px}
  .practice .row{display:grid;grid-template-columns:1fr 1fr;gap:8px}
  .practice .row .btn{min-height:44px;padding:8px 6px}
  .practice .row .btn.primary{grid-column:1/-1}
  .shadow .row{display:grid;grid-template-columns:1fr 1fr;gap:8px}
  .shadow .sh-adj{grid-template-columns:1fr 1fr}
  .shadow .sh-adj .ko{grid-column:1/-1}
  #player-wrap{left:0;right:0;bottom:0;width:100%;border-radius:14px 14px 0 0;
    padding:8px 8px calc(8px + env(safe-area-inset-bottom))}
  body.player-open main{padding-bottom:calc(56vw + 90px)}
}
</style>

<body>
<header>
  <h1 id="app-title">🎧 유튜버 영어 표현</h1>
  <select id="channel" aria-label="유튜버 선택"></select>
</header>
<main>
  <div class="install" id="install"></div>
  <div class="tabs" id="tabs"></div>
  <p class="note" id="note"></p>
  <div id="list"></div>
</main>

<div id="player-wrap">
  <div class="bar"><span id="player-title"></span><button class="btn" id="player-close">닫기</button></div>
  <div id="player-box"><div id="player"></div></div>
</div>

<script src="data.js"></script>
<script>
const DATA = window.APP_DATA || {channels: [], trends: null};
const $ = s => document.querySelector(s);
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const TYPE_KO = {idiom:"관용구", phrasal_verb:"구동사", spoken_expression:"구어 표현", slang:"슬랭"};

// ───────── 저장 (이 브라우저에만) ─────────
function loadBest(){ try { return JSON.parse(localStorage.getItem("best") || "{}"); } catch { return {}; } }
function saveBest(key, score){
  try { const b = loadBest(); if (!(b[key] >= score)) { b[key] = score; localStorage.setItem("best", JSON.stringify(b)); } } catch {}
}

// ───────── 발음 채점: 들린 단어 vs 목표 문장 (순서 유지 최장 일치) ─────────
function words(s){
  return String(s).toLowerCase().replace(/[’‘]/g,"'").match(/[a-z0-9]+(?:'[a-z]+)?/g) || [];
}
function align(target, heard){
  const t = words(target), h = words(heard), n = t.length, m = h.length;
  const dp = Array.from({length:n+1}, () => new Array(m+1).fill(0));
  for (let i=n-1;i>=0;i--) for (let j=m-1;j>=0;j--)
    dp[i][j] = t[i]===h[j] ? dp[i+1][j+1]+1 : Math.max(dp[i+1][j], dp[i][j+1]);
  const ok = new Array(n).fill(false);
  let i=0,j=0;
  while (i<n && j<m){
    if (t[i]===h[j]) { ok[i]=true; i++; j++; }
    else if (dp[i+1][j] >= dp[i][j+1]) i++; else j++;
  }
  const hit = ok.filter(Boolean).length;
  return {score: n ? Math.round(hit/n*100) : 0, ok, extra: Math.max(0, m-hit)};
}
function markTarget(target, ok){
  // 원문 표기는 살리고, 단어마다 맞음/놓침 색칠
  // 단어를 먼저 나눈 뒤 조각마다 이스케이프 (먼저 이스케이프하면 It's → It&#39;s 로 쪼개짐)
  let k = 0, out = "", last = 0;
  for (const m of String(target).matchAll(/[A-Za-z0-9]+(?:['’][A-Za-z]+)?/g)) {
    out += esc(target.slice(last, m.index)) + `<span class="w ${ok[k++] ? "ok" : "miss"}">${esc(m[0])}</span>`;
    last = m.index + m[0].length;
  }
  return out + esc(target.slice(last));
}
function feedback(r){
  if (r.score >= 90) return "아주 좋아요! 원어민이 알아들을 수 있는 발음입니다.";
  if (r.score >= 70) return "거의 다 왔어요. 빨간 단어만 다시 들어 보고 따라 해 보세요.";
  if (r.score >= 40) return "절반 정도 전달됐어요. 천천히 듣기로 끊어 읽는 곳을 따라 해 보세요.";
  return "잘 안 들렸어요. 마이크에 가까이, 문장을 천천히 또박또박 말해 보세요.";
}

// ───────── 듣기 (브라우저 음성) ─────────
function speak(text, rate){
  if (!("speechSynthesis" in window)) return alert("이 브라우저는 읽어 주기를 지원하지 않습니다.");
  speechSynthesis.cancel();
  const u = new SpeechSynthesisUtterance(text);
  u.lang = "en-US"; u.rate = rate;
  const v = speechSynthesis.getVoices().find(v => v.lang.replace("_", "-") === "en-US");
  if (v) u.voice = v;
  speechSynthesis.speak(u);
}

// ───────── 말하기: 음성 인식 + 내 목소리 녹음 ─────────
const SR = window.SpeechRecognition || window.webkitSpeechRecognition;
const IS_IOS = /iPhone|iPad|iPod/.test(navigator.userAgent) || (navigator.platform === "MacIntel" && navigator.maxTouchPoints > 1);
const IS_ANDROID = /Android/.test(navigator.userAgent);
// 휴대폰은 마이크를 녹음과 음성 인식이 동시에 못 쓰는 경우가 많아서, 녹음 다시 듣기는 PC에서만
const CAN_RECORD = !(IS_IOS || IS_ANDROID) && "MediaRecorder" in window;
const SR_ERR = {
  "not-allowed": "마이크 사용을 허용해 주세요. (주소창 옆 자물쇠 → 마이크 허용)",
  "service-not-allowed": IS_IOS ? "아이폰 설정 → Siri에서 'Siri 및 받아쓰기'를 켜야 발음 연습이 됩니다." : "이 브라우저에서 음성 인식을 쓸 수 없습니다.",
  "audio-capture": "마이크를 찾지 못했어요. 다른 앱이 마이크를 쓰고 있는지 확인해 주세요.",
  "network": "인터넷 연결을 확인해 주세요. 음성 인식은 인터넷이 필요합니다.",
};
let active = null;
async function practice(btn, target, key){
  if (!SR) return alert(IS_IOS ? "아이폰은 사파리에서 발음 연습이 됩니다." : "발음 연습은 크롬·엣지·삼성 인터넷 최신 버전에서 됩니다.");
  if (active) { active.stop(); return; }
  window.speechSynthesis?.cancel();
  const box = btn.closest(".practice").querySelector(".result");
  let recorder = null, chunks = [];
  if (CAN_RECORD) try {
    const stream = await navigator.mediaDevices.getUserMedia({audio:true});
    recorder = new MediaRecorder(stream);
    recorder.ondataavailable = e => chunks.push(e.data);
    recorder.onstop = () => {
      stream.getTracks().forEach(t => t.stop());
      const a = box.querySelector("audio");
      if (a && chunks.length) { a.src = URL.createObjectURL(new Blob(chunks, {type: recorder.mimeType})); a.hidden = false; }
    };
    recorder.start();
  } catch { /* 녹음이 안 돼도 인식은 시도 */ }

  const rec = new SR();
  rec.lang = "en-US"; rec.interimResults = false; rec.maxAlternatives = 5;
  active = rec;
  btn.textContent = "■ 그만 (말하는 중…)"; btn.classList.add("rec");
  let best = null;
  rec.onresult = e => {
    for (const alt of e.results[0]) {
      const r = align(target, alt.transcript);
      if (!best || r.score > best.score) best = {...r, heard: alt.transcript};
    }
  };
  let errMsg = "";
  rec.onerror = e => { errMsg = SR_ERR[e.error] || ""; };
  // 휴대폰에서 말이 끝나도 인식이 안 멈추는 경우 대비: 문장 길이에 맞춰 자동 종료
  const limit = setTimeout(() => { try { rec.stop(); } catch {} }, 4000 + words(target).length * 600);
  rec.onend = () => {
    clearTimeout(limit);
    active = null; btn.textContent = "🎙 따라 말하기"; btn.classList.remove("rec");
    if (recorder && recorder.state !== "inactive") recorder.stop();
    box.style.display = "block";
    if (!best) {
      box.querySelector(".body").innerHTML = `<div class="tip">${esc(errMsg || "아무 말도 들리지 않았어요. 다시 눌러서 말해 보세요.")}</div>`;
      return;
    }
    saveBest(key, best.score); touchStreak();
    box.querySelector(".body").innerHTML =
      `<div class="score">${best.score}점</div>
       <div class="sent">${markTarget(target, best.ok)}</div>
       <div class="heard">들린 말: “${esc(best.heard)}”</div>
       <div class="tip">${feedback(best)}</div>`;
    render.refreshBadges();
  };
  rec.start();
}

let ytReady = null, player = null, stopTimer = null;
function loadYT(){
  if (ytReady) return ytReady;
  ytReady = new Promise(res => {
    window.onYouTubeIframeAPIReady = res;
    const s = document.createElement("script"); s.src = "https://www.youtube.com/iframe_api"; document.head.appendChild(s);

// start~end 구간을 재생하고, 끝나면 true (재생이 시작되지 않으면 false)
let segWatch = null;
async function playSegment(videoId, start, end, title){
  $("#player-wrap").style.display = "block"; document.body.classList.add("player-open");
  $("#player-title").textContent = title || "";
  await loadYT();
  clearInterval(segWatch);
  if (!player) {
    await new Promise(res => {
      player = new YT.Player("player", {videoId,
        playerVars:{start:Math.floor(start), end:Math.ceil(end), autoplay:1, rel:0, playsinline:1},
        events:{onReady: res}});
    });
  } else {
    player.loadVideoById({videoId, startSeconds:start, endSeconds:end});
  }
  return new Promise(res => {
    const t0 = Date.now();
    segWatch = setInterval(() => {
      const st = player.getPlayerState?.(), ct = player.getCurrentTime?.() || 0;
      if (ct >= end - 0.15 || st === YT.PlayerState.ENDED) { clearInterval(segWatch); player.pauseVideo(); res(true); }
      else if (Date.now() - t0 > (end - start) * 1000 + 15000) { clearInterval(segWatch); res(false); }
    }, 100);
  });
}
async function playScene(videoId, startSec, title){
  if (location.protocol === "file:") {
    window.open(`https://youtu.be/${videoId}?t=${Math.floor(startSec)}`, "_blank"); return;
  }
  const start = Math.max(0, Math.floor(startSec) - 1);

}

function loadOffsets(){ try { return JSON.parse(localStorage.getItem("shadowOffset") || "{}"); } catch { return {}; } }
function shadowRange(sh){
  // 받아쓰기 시각이 조금씩 어긋날 수 있어 문장 길이로 구간을 잡고, 이용자가 0.5초씩 조절
  const off = loadOffsets()[sh.key] || 0;
  const start = Math.max(0, sh.start - 0.3 + off);
  const dur = Math.min(9, Math.max(2.5, words(sh.text).length * 0.38 + 1.2));
  return {start, end: start + dur, dur};
}
let shadowBusy = false;
function shadowUI(box, sh, stage, msg){
  const r = shadowRange(sh);
  const range = `<span class="ko">구간 ${r.start.toFixed(1)}~${r.end.toFixed(1)}초</span>`;

  box.innerHTML = `<div class="sh-msg ${stage}">${msg}</div>${after}

  // 휴대폰에서 아래쪽 영상 플레이어에 가리지 않게 올려 보이기

    const pTop = wrap.getBoundingClientRect().top, b = box.getBoundingClientRect();
    if (b.bottom > pTop - 8) window.scrollBy(0, b.bottom - pTop + 16);

async function shadow(btn){
  if (shadowBusy) return;
  if (location.protocol === "file:") return alert("쉐도잉은 웹 주소(http)로 열어야 됩니다.");
  if (!("MediaRecorder" in window) || !navigator.mediaDevices?.getUserMedia) return alert("이 브라우저는 녹음을 지원하지 않습니다.");
  const blk = btn.closest(".practice"), box = blk.querySelector(".shadow");
  const sh = blk._sh = JSON.parse(btn.dataset.shadow);
  const r = shadowRange(sh);
  shadowBusy = true;
  try {
    window.speechSynthesis?.cancel();
    shadowUI(box, sh, "listen", "① 원본을 잘 들으세요…");
    const ok = await playSegment(sh.video, r.start, r.end, sh.title);
    if (!ok) { shadowUI(box, sh, "fail", "영상이 재생되지 않았어요. 아래 플레이어의 ▶를 한 번 누른 뒤 다시 해 보세요."); return; }
    // 마이크는 원본이 끝난 뒤에 켠다 (아이폰은 마이크가 켜져 있으면 영상 소리가 작아짐)
    let stream;
    try { stream = await navigator.mediaDevices.getUserMedia({audio:true}); }
    catch { shadowUI(box, sh, "fail", "마이크 사용을 허용해 주세요."); return; }
    const rec = new MediaRecorder(stream), chunks = [];
    rec.ondataavailable = e => chunks.push(e.data);
    const stopped = new Promise(res => rec.onstop = res);
    rec.start();
    const total = Math.ceil(r.dur + 1.5);
    for (let s = total; s > 0; s--) {
      shadowUI(box, sh, "rec", `② 🔴 지금 똑같이 따라 말하세요! <b>${s}</b>`);
      await new Promise(res => setTimeout(res, 1000));
    }
    rec.stop(); await stopped;
    stream.getTracks().forEach(t => t.stop());
    if (blk._shUrl) URL.revokeObjectURL(blk._shUrl);
    blk._shUrl = URL.createObjectURL(new Blob(chunks, {type: rec.mimeType}));
    shadowUI(box, sh, "done", "③ 원본과 내 목소리를 비교해 보세요."); touchStreak();
  } finally { shadowBusy = false; }
}
function playMine(blk){
  return new Promise(res => {
    if (!blk._shUrl) return res();
    const a = new Audio(blk._shUrl); a.onended = res; a.onerror = res; a.play().catch(res);
  });
}
async function shadowAction(btn){
  const blk = btn.closest(".practice"), sh = blk._sh, box = blk.querySelector(".shadow");
  if (!sh || shadowBusy) return;
  const r = shadowRange(sh);

    const o = loadOffsets(); o[sh.key] = Math.round(((o[sh.key] || 0) + +btn.dataset.shift) * 10) / 10;
    try { localStorage.setItem("shadowOffset", JSON.stringify(o)); } catch {}
    const r2 = shadowRange(sh);

    shadowBusy = true; try { await playSegment(sh.video, r2.start, r2.end, sh.title); } finally { shadowBusy = false; }
    return;
  }

}

// 장면 머리: 유튜브 공식 썸네일 + 영상 제목 + "이 장면에서 쓰였어요" (누르면 그 구간 재생)

const PRINCESS = ["kyliejenner", "khloekardashian"];
const PRINCESS_SUB = {kyliejenner: "카일리처럼 말하기 ✨", khloekardashian: "클로이처럼 말하기 💗"};

// ───────── 📅 오늘의 표현 · 복습 · 연속 학습 (기록은 이 휴대폰/브라우저에만) ─────────
const NEW_PER_DAY = 5, INTERVALS = [1, 3, 7, 14, 30];  // 복습 간격(일): 기억나면 다음 칸, 헷갈리면 처음부터
const dayNum = (d = new Date()) => Math.floor((d - d.getTimezoneOffset() * 60000) / 86400000);
function loadJSON(k, d){ try { const v = JSON.parse(localStorage.getItem(k)); return v ?? d; } catch { return d; } }
function saveJSON(k, v){ try { localStorage.setItem(k, JSON.stringify(v)); } catch {} }
const itemKey = (slug, expr) => `${slug}|${expr}`;
const chName = ch => ch.info?.title || ch.channel;
function bankIndex(){
  const m = new Map();
  DATA.channels.forEach(ch => (ch.bank || ch.everyday || []).forEach(e => m.set(itemKey(ch.channel, e.expression), {ch, e})));
  return m;
}
function myChannels(){
  const all = DATA.channels.map(c => c.channel), mine = loadJSON("myChannels", null);
  const sel = (mine || all).filter(c => all.includes(c));
  return sel.length ? sel : all;
}
function pickNew(n, exclude, learn){
  // 내 유튜버들을 번갈아 가며, 각 유튜버의 점수 높은(=자주·널리 쓰는) 표현부터
  const mine = myChannels();
  const queues = DATA.channels.filter(c => mine.includes(c.channel))
    .map(c => (c.bank || c.everyday || []).map(e => itemKey(c.channel, e.expression)).filter(k => !learn[k] && !exclude.includes(k)));
  // 같은 표현(kind of 등)은 유튜버가 달라도 한 번만
  const exprOf = k => k.slice(k.indexOf("|") + 1).toLowerCase();
  const used = new Set([...Object.keys(learn), ...exclude].map(exprOf));
  const picks = [];
  while (picks.length < n && queues.some(q => q.length))
    for (const q of queues) {
      while (q.length && used.has(exprOf(q[0]))) q.shift();
      if (q.length && picks.length < n) { const k = q.shift(); used.add(exprOf(k)); picks.push(k); }
    }
  return picks;
}
function todayPlan(){
  const today = dayNum(), learn = loadJSON("learn", {});
  let plan = loadJSON("todayPlan", null);
  const mineKey = myChannels().slice().sort().join(",");
  if (!plan || plan.day !== today) { plan = {day: today, mine: mineKey, picks: pickNew(NEW_PER_DAY, [], learn)}; saveJSON("todayPlan", plan); }
  else if (plan.mine !== mineKey) {
    // 내 유튜버를 바꾸면: 이미 익힌 건 두고, 안 본 표현만 새 유튜버 기준으로 다시 고름
    const kept = plan.picks.filter(k => learn[k]?.first === today);
    plan = {day: today, mine: mineKey, picks: [...kept, ...pickNew(Math.max(0, NEW_PER_DAY - kept.length), kept, learn)]};
    saveJSON("todayPlan", plan);
  }
  const due = Object.entries(learn)
    .filter(([k, v]) => v.due <= today && !plan.picks.includes(k) && v.last !== today)
    .sort((a, b) => a[1].due - b[1].due).map(([k]) => k);
  return {today, plan, due, learn};
}
function touchStreak(){
  const s = loadJSON("streak", {last: null, n: 0}), t = dayNum();
  if (s.last === t) return;
  s.n = s.last === t - 1 ? s.n + 1 : 1; s.last = t; saveJSON("streak", s);
}
function streakNow(){ const s = loadJSON("streak", {last: null, n: 0}); return s.last >= dayNum() - 1 ? s.n : 0; }
function markSeen(key){
  const learn = loadJSON("learn", {}), t = dayNum();
  if (!learn[key]) learn[key] = {stage: 0, first: t, last: t, due: t + INTERVALS[0]};
  saveJSON("learn", learn); touchStreak();
}
function reviewItem(key, ok){
  const learn = loadJSON("learn", {}), t = dayNum(), v = learn[key] || {stage: 0, first: t};
  v.stage = ok ? Math.min((v.stage || 0) + 1, INTERVALS.length - 1) : 0;
  v.last = t; v.due = t + INTERVALS[v.stage]; learn[key] = v;
  saveJSON("learn", learn); touchStreak();
}

  if (!plan.picks.length) html += `<div class="empty">새 표현을 다 배웠어요! 새 영상이 분석되면 더 생깁니다.</div>`;
  plan.picks.forEach((k, i) => {

    const footer = done
      ? `<div class="done-msg">✅ 오늘 익혔어요 · 내일 복습에 나와요</div>`
      : `<button class="btn primary wide" data-seen="${esc(k)}">✅ 다 봤어요 (내일 복습)</button>`;
    html += `<div class="label">${esc(chName(it.ch))}</div>` + everydayCard(it.ch, it.e, i, footer);
  });
  if (plan.picks.length && doneNew === plan.picks.length)
    html += `<div class="row" style="justify-content:center;margin-bottom:14px"><button class="btn" data-more="1">➕ 5개 더 배우기</button></div>`;

  html += `<h2 class="sec">🔁 복습 <span class="ko">${due.length}개</span></h2>`;
  html += due.length ? due.map(k => { const it = idx.get(k); return it ? reviewCard(it.ch, it.e, k) : ""; }).join("")
    : `<div class="empty small">${learned ? "오늘 복습할 표현이 없어요." : "오늘 배운 표현은 내일부터 여기에 나와요."}</div>`;

  if (doneNew === plan.picks.length && !due.length && plan.picks.length)
    html = `<div class="install" style="display:block">🎉 오늘 학습 완료! 내일 새 표현 ${NEW_PER_DAY}개가 기다려요.</div>` + html;
  return html;
}

function signatureCard(ch, s, i){
  return `<div class="card">
    <div class="top"><span class="expr">${i+1}. ${esc(s.phrase)}</span>${s.learnable ? "" : `<span class="badge">말버릇 (따라 쓰기 비추천)</span>`}</div>
    <div class="meaning">${esc(s.meaning_ko)}</div>
    <p class="nuance">${esc(s.why_ko)}</p>
    ${practiceBlock(s.video_id ? sceneHead(ch, s.video_id, s.start_sec, videoTitle(ch, s.video_id)) : `🎬 ${esc(chName(ch))}의 실제 대사`, s.example_en, "", `${ch.channel}|sig|${s.phrase}`,
      sceneBtns(s.video_id, s.start_sec, "", s.example_en, `${ch.channel}|sig|${s.phrase}`))}
  </div>`;
}

function trendCard(t, i, kind){
  const where = kind === "song" ? `<div class="label">🎵 ${t.rank}위 ${esc(t.song)} - ${esc(t.artist)} · ${esc(t.where_ko || "")}</div>` : "";
  const usage = t.usage === "friends_only" ? `<span class="badge">친구끼리만</span>` : `<span class="badge share">어디서나 OK</span>`;
  const src = (t.source_urls || []).slice(0, 2).map((u, k) => `<a href="${esc(u)}" target="_blank" rel="noopener">출처${k+1}</a>`).join(" · ");
  return `<div class="card">
    ${where}
    <div class="top"><span class="expr">${i+1}. ${esc(t.expression)}</span>${usage}</div>
    <div class="meaning">${esc(t.meaning_ko)}</div>
    <p class="nuance">${esc(t.nuance_ko)}${t.origin_ko ? " " + esc(t.origin_ko) : ""}</p>
    ${src ? `<div class="ko">${src}</div>` : ""}
    ${practiceBlock("✏️ 예문", t.example_en, t.example_ko, `trend|${t.expression}`)}
  </div>`;
}

const render = {
  tab: "today",
  refreshBadges(){
    const b = loadBest();
    document.querySelectorAll("[data-best]").forEach(el => {
      const v = b[el.dataset.best]; if (v != null) { el.textContent = `최고 ${v}점`; el.hidden = false; }
    });
  },
  draw(){
    const ch = DATA.channels[$("#channel").value];
    const tabs = [["today","📅 오늘"],["everyday","📘 일상 필수 표현"],["signature","⭐ 시그니처"],["trends","🔥 이번 주 트렌드"]];
    $("#channel").style.display = this.tab === "today" ? "none" : "";
    $("#tabs").innerHTML = tabs.map(([k,l]) => `<button class="tab ${k===this.tab?"on":""}" data-tab="${k}">${l}</button>`).join("");
    let html = "", note = "";
    if (this.tab === "today") {
      html = DATA.channels.length ? todayView() : `<div class="empty">아직 분석한 유튜버가 없습니다.</div>`;
    } else if (this.tab === "trends") {
      const t = DATA.trends;
      if (!t) html = `<div class="empty">이번 주 트렌드 표현은 준비 중입니다.</div>`;
      else {
        note = `${t.week} 기준 미국에서 유행하는 표현과 인기곡 속 표현입니다. 가사는 싣지 않습니다.`;
        html = (t.slang||[]).map((x,i)=>trendCard(x,i,"slang")).join("") + (t.songs||[]).map((x,i)=>trendCard(x,i,"song")).join("");
      }
    } else if (!ch) {
      html = `<div class="empty">분석한 유튜버가 없습니다.<br><code>python main.py 채널이름</code> 을 먼저 실행하세요.</div>`;
    } else if (this.tab === "everyday") {
      note = `${ch.info?.title || ch.channel} 영상 ${ch.videos_analyzed}개에서 뽑은 표현입니다.` +
        (ch.corpus_size ? ` 다른 원어민 유튜버 ${ch.corpus_size}명과 비교해 검증했습니다.` : " (아직 비교용 말뭉치가 없어 원어민 사용률은 표시하지 않습니다.)");
      html = (ch.everyday||[]).map((e,i)=>everydayCard(ch,e,i)).join("") || `<div class="empty">표현이 없습니다.</div>`;
    } else {
      note = "이 유튜버는 자주 쓰는데 다른 유튜버들은 잘 안 쓰는 말버릇입니다.";
      html = (ch.signatures||[]).map((s,i)=>signatureCard(ch,s,i)).join("") ||
        `<div class="empty">아직 시그니처 표현이 없습니다.<br>비교용 말뭉치가 쌓이면 나타납니다. (<code>python corpus.py build</code>)</div>`;
    }
    // 👑 카일리·클로이 화면은 공주풍 테마
    const princess = this.tab === "today"
      ? myChannels().every(c => PRINCESS.includes(c))
      : this.tab !== "trends" && !!ch && PRINCESS.includes(ch.channel);
    document.body.classList.toggle("princess", princess);
    $("#app-title").textContent = princess ? "Princess English" : "🎧 유튜버 영어 표현";
    document.querySelector('meta[name="theme-color"]').content = princess ? "#ffd1e3" : "#2f6fec";
    if (princess && ch && this.tab !== "today")
      html = `<div class="hero"><div class="crown">👑</div><div class="name">${esc(chName(ch))}</div>
        <div class="sub">${esc(PRINCESS_SUB[ch.channel] || "")} · 영상 ${ch.videos_analyzed}개 · 표현 ${(ch.bank || ch.everyday || []).length}개</div></div>` + html;
    $("#note").textContent = note;
    $("#list").innerHTML = html;
  }
};

$("#channel").innerHTML = DATA.channels.map((c,i)=>`<option value="${i}">${esc(c.info?.title || c.channel)}</option>`).join("") || `<option>유튜버 없음</option>`;
$("#channel").onchange = () => render.draw();
document.addEventListener("click", e => {
  const t = e.target.closest("button"); if (!t) return;
  if (t.dataset.tab) { render.tab = t.dataset.tab; render.draw(); }
  else if (t.dataset.say) speak(t.dataset.say, +t.dataset.rate);
  else if (t.dataset.practice) practice(t, t.dataset.practice, t.dataset.key);
  else if (t.dataset.play) playScene(t.dataset.play, +t.dataset.start, t.dataset.title);
  else if (t.dataset.seen) { markSeen(t.dataset.seen); render.draw(); }
  else if (t.dataset.review) { reviewItem(t.dataset.review, t.dataset.ok === "1"); render.draw(); }
  else if (t.dataset.more) {
    const {plan, learn} = todayPlan();
    plan.picks.push(...pickNew(NEW_PER_DAY, plan.picks, learn)); saveJSON("todayPlan", plan); render.draw();
  }
  else if (t.dataset.mych) {
    const mine = myChannels(), c = t.dataset.mych;
    const next = mine.includes(c) ? mine.filter(x => x !== c) : [...mine, c];
    if (next.length) { saveJSON("myChannels", next); render.draw(); }
  }
  else if (t.dataset.newseen) { const s = loadJSON("seenNewest", {}); s[t.dataset.newseen] = DATA.channels.find(c => c.channel === t.dataset.newseen)?.newest_video?.id; saveJSON("seenNewest", s); render.draw(); }
  else if (t.dataset.shadow) shadow(t);
  else if (t.dataset.sh || t.dataset.shift) shadowAction(t);
});
render.draw();

// ───────── 홈 화면에 추가 (앱처럼 쓰기) ─────────
if ("serviceWorker" in navigator && location.protocol !== "file:") navigator.serviceWorker.register("sw.js").catch(() => {});
(function installHint(){
  const standalone = matchMedia("(display-mode: standalone)").matches || navigator.standalone;
  let dismissed = false; try { dismissed = localStorage.getItem("installDismissed") === "1"; } catch {}
  if (standalone || dismissed) return;
  const box = $("#install");
  const close = `<button class="btn" id="install-close">닫기</button>`;
  const show = (html) => { box.innerHTML = html; box.style.display = "block";
    $("#install-close").onclick = () => { box.style.display = "none"; try { localStorage.setItem("installDismissed", "1"); } catch {} }; };
  if (IS_IOS) {
    show(`📲 앱처럼 쓰려면 사파리 아래쪽 <b>공유 버튼</b> → <b>홈 화면에 추가</b>를 누르세요.<div class="row">${close}</div>`);
  } else {
    window.addEventListener("beforeinstallprompt", e => {
      e.preventDefault();
      show(`📲 홈 화면에 추가하면 앱처럼 바로 열 수 있어요.<div class="row"><button class="btn primary" id="install-go">홈 화면에 추가</button>${close}</div>`);
      $("#install-go").onclick = async () => { e.prompt(); await e.userChoice; box.style.display = "none"; };
    });
  }
})();
</script>
</body>
</html>
